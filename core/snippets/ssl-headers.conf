# ==============================================================================
# LeanStack Modular SSL Security Headers (SSL Labs A+ 100% Score)
# Isolated into a reusable snippet to prevent Nginx/Angie add_header inheritance wipeout
# ==============================================================================

# HTTP Strict Transport Security (HSTS) with subdomains and preload (2 years)
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

# Prevent MIME-type sniffing
add_header X-Content-Type-Options "nosniff" always;

# Clickjacking Protection
add_header X-Frame-Options "SAMEORIGIN" always;

# Cross-Site Scripting Protection
add_header X-XSS-Protection "1; mode=block" always;

# Referrer Policy
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Permissions Policy
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

# Baseline Content Security Policy (Enforces WebAssembly blob: worker creation)
add_header Content-Security-Policy "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval'; worker-src 'self' blob:; frame-ancestors 'self';" always;

# Post-Quantum / HTTP/3 Protocol Advertisement (Alt-Svc for QUIC)
add_header Alt-Svc 'h3=":443"; ma=86400';
