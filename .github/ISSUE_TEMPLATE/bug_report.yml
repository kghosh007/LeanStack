name: Bug Report
description: Create a report to help us reproduce and fix an issue
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue in LeanStack!
  - type: input
    id: version
    attributes:
      label: LeanStack Version
      description: Run `lsctl --version` or check `core/version.json`
      placeholder: e.g. 1.2.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating System & Hardware
      description: Server OS and specs
      placeholder: e.g. Ubuntu 24.04 LTS (4 vCPU, 8GB RAM, Xeon Gold)
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps To Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Run `sudo lsctl site create example.com ...`
        2. Inspect output
        3. See error
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Error Output
      description: Paste any command output or log snippets.
      render: shell
