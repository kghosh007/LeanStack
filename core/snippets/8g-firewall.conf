# ==============================================================================
# 8G Firewall for Angie / Nginx by Jeff Starr (Adapted for LeanStack)
# Ultra-Lightweight Web Application Firewall (Zero-Overhead C-level filtering)
# ==============================================================================

# 8G:[QUERY STRING]
if ($query_string ~* "([a-z0-9]{2000,})") { return 403; }
if ($query_string ~* "(/|%2f)(:|%3a)(/|%2f)") { return 403; }
if ($query_string ~* "(order(\s|%20)by(\s|%20)1--|(select|union|insert|drop|truncate)(\s|%20))") { return 403; }
if ($query_string ~* "(etc/passwd|/proc/self|/boot.ini)") { return 403; }
if ($query_string ~* "(eval\(|base64_decode\(|gzinflate\(|passthru\()") { return 403; }
if ($query_string ~* "(<script|%3cscript|<iframe|%3ciframe)") { return 403; }
if ($query_string ~* "(GLOBALS|REQUEST|_SERVER|_ENV)\b") { return 403; }

# 8G:[REQUEST URI]
if ($request_uri ~* "(\.git|\.env|\.htaccess|\.htpasswd|\.conf|\.bak|\.sql|\.log)($|\?)") { return 403; }
if ($request_uri ~* "(\.\./|\.\.\\\\)") { return 403; }
if ($request_uri ~* "(wp-config\.php|readme\.html|license\.txt)") { return 403; }
if ($request_uri ~* "(wp-content/debug\.log)") { return 403; }

# 8G:[USER AGENT]
if ($http_user_agent ~* "([a-z0-9]{2000,})") { return 403; }
if ($http_user_agent ~* "(acunetix|sqlmap|nikto|havij|nmap|morfeus|zmeu|dirbuster)") { return 403; }
if ($http_user_agent ~* "(masscan|zgrab|binlar|casper|cmsworldmap|diavol|dotbot)") { return 403; }

# 8G:[REQUEST METHOD]
if ($request_method !~ "^(GET|POST|HEAD|PUT|DELETE|OPTIONS|PURGE)$") { return 405; }
