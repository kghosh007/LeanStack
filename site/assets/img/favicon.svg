<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="lsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6900" />
      <stop offset="100%" stop-color="#F72B00" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#F72B00" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background Squircle -->
  <rect width="64" height="64" rx="16" fill="#161413"/>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#332F2C" stroke-width="2"/>
  <!-- High-Density Stack Layers -->
  <g filter="url(#glow)">
    <!-- Top Layer (Angie HTTP/3 Edge) -->
    <path d="M16 22 L32 14 L48 22 L32 30 Z" fill="url(#lsGrad)" />
    <!-- Middle Layer (Valkey / SSI Hole-Punch) -->
    <path d="M16 30 L32 38 L48 30 L44 32 L32 38 L20 32 Z" fill="#FF6900" opacity="0.9" />
    <path d="M16 32 L32 40 L48 32" fill="none" stroke="#FF8A3D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Bottom Layer (MariaDB Silicon Cache Line) -->
    <path d="M16 40 L32 48 L48 40" fill="none" stroke="#00D084" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Speed Dot -->
  <circle cx="32" cy="22" r="3" fill="#FFFFFF" />
</svg>