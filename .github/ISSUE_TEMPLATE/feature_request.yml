name: Feature Request
description: Suggest an idea or architectural improvement for LeanStack
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Suggest an architectural optimization, CLI flag, or stack improvement!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear description of what the problem or limitation is.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the Solution You'd Like
      description: A clear description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe Alternatives You've Considered
      description: Any alternative solutions or features considered.
